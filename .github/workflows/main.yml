name: Data Preprocessing CI

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  data-processing-job:
    name: Run Automate Preprocessing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas scikit-learn numpy

      - name: Execute Preprocessing Script
        run: |
          cd preprocessing
          python automate_Budiman-Nurhadi.py

      - name: Upload Processed Dataset
        uses: actions/upload-artifact@v4
        with:
          name: processed-dataset-terbaru
          path: preprocessing/btc_preprocessing.csv
          retention-days: 7
